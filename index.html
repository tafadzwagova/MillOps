.wrap{font-family:'Instrument Sans',system-ui,sans-serif;background:#EEF1F4;color:#16212E;min-height:100vh;padding:18px;font-size:13.5px;font-variant-numeric:tabular-nums}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.brand{font-size:12px;color:#5B6B7A;font-weight:500}
h1{margin:2px 0 0;font-size:24px;font-weight:700;letter-spacing:-.01em}
h1 .yr{font-weight:400;color:#5B6B7A;font-size:16px}
.ctl{display:flex;gap:8px;flex-wrap:wrap}
select,button{font:inherit;border:1px solid #C3CBD3;background:#fff;border-radius:4px;padding:6px 10px;color:#16212E;cursor:pointer}
button.primary{background:#1F3A6E;color:#fff;border-color:#1F3A6E;min-width:70px}
button.danger{border-color:#8B0000;color:#8B0000}
.tabs{display:flex;gap:0;border-bottom:2px solid #C3CBD3;margin-bottom:14px}
.tabs button{border:0;background:none;border-radius:0;padding:8px 14px;color:#5B6B7A;font-weight:500;margin-bottom:-2px;border-bottom:2px solid transparent}
.tabs button.on{color:#16212E;border-bottom-color:#B8860B;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.span{grid-column:1/-1}
.kpi-narrow{display:none}
@media(max-width:720px){.grid2{grid-template-columns:1fr}}
@media(max-width:600px){
  .wrap{padding:12px 10px;font-size:15px;overflow-x:hidden}
  *,*:before,*:after{box-sizing:border-box}
  .kpi-wide{display:none}.kpi-narrow{display:block}
  .kpi-narrow table+table{margin-top:14px}
  table{white-space:normal}
  th{font-size:13px;padding:6px 4px}td{padding:6px 4px}
  .card{padding:12px}
  .inp{font-size:16px;padding:6px 6px}
  .kv label{padding:8px 0}
  select,button{padding:10px 12px;font-size:15px}
  select{max-width:100%}
  .ctl{width:100%}.ctl select{flex:1 1 100%}.ctl button{flex:1}
  .tabs button{flex:1;padding:10px 0}
  .headline p{font-size:16px}
  .wf{max-width:100%}
  .foot{flex-direction:column;align-items:stretch}.foot span{display:flex;gap:8px}.foot span button{flex:1}
}
.card{background:#fff;border:1px solid #DAE0E6;border-radius:4px;padding:12px 14px}
.card h2{margin:0 0 8px;font-size:14px;font-weight:600}
.card h2.bridge{font-size:18px;font-weight:700;letter-spacing:-.01em}
.card h2.bridge small{display:block;margin:2px 0 0;font-size:12px}
.card h2 small{font-weight:400;color:#5B6B7A;margin-left:6px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;white-space:nowrap}
th{font-weight:500;color:#5B6B7A;text-align:right;padding:4px 6px;border-bottom:1px solid #DAE0E6;font-size:12px}
th:first-child{text-align:left}
td{padding:3px 6px;border-bottom:1px solid #F0F3F5}
td.n{text-align:right}
td.b{font-weight:600}
tr.tot td{border-top:1px solid #16212E;font-weight:600;background:#F7F9FB}
tr.au td{background:#FBF4DC}
.inp{font:inherit;text-align:right;background:#FFF2A8;color:#8B0000;border:1px solid #E6D77A;border-radius:3px;padding:3px 5px;font-weight:500}
.inpwrap{position:relative;display:inline-block}
.inp.has-suffix{padding-right:22px}
.suffix{position:absolute;right:7px;top:50%;transform:translateY(-50%);color:#8B0000;font-weight:500;pointer-events:none}
.inp.txt{width:180px;text-align:left}
.inp.ta{width:100%;text-align:left;margin-top:8px;font-family:inherit;resize:vertical}
.trend{max-width:460px}
.inp:focus{outline:2px solid #B8860B;outline-offset:0}
.kv label{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid #F0F3F5;gap:8px}
.kv .row{display:flex;justify-content:space-between;padding:6px 0;color:#5B6B7A}
.kv .row b{color:#16212E}
.muted{color:#5B6B7A}.small{font-size:12px;margin:8px 0 0}
.neg{color:#8B0000}.pos{color:#00A650}
.headline p{margin:0 0 8px;font-size:15px;line-height:1.45;max-width:72ch}
.headline button{margin-top:4px}
.wf{width:100%;max-width:360px;display:block}
.wft{font-size:11px;font-weight:600;fill:#16212E}
.wfl{font-size:11px;fill:#5B6B7A}
.wfa{font-size:9px;fill:#5B6B7A}
.halo{paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
.foot{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;color:#5B6B7A;font-size:12px}
.sw{display:inline-block;width:12px;height:12px;background:#FFF2A8;border:1px solid #E6D77A;vertical-align:-2px;margin-right:4px}

.printpage{display:none}
@media print{
  @page{size:A4 portrait;margin:12mm 14mm}
  .app{display:none!important}
  .wrap{background:#fff;padding:0;min-height:0;font-size:11.5px;color:#111}
  .printpage{display:flex;flex-direction:column;width:100%;height:271mm}
  .pp-head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #1F3A6E;padding-bottom:6px;margin-bottom:10px}
  .pp-co{font-size:12px;color:#5B6B7A;font-weight:500}
  .pp-title{font-size:22px;font-weight:700;letter-spacing:-.01em;color:#1F3A6E}
  .pp-meta{text-align:right;font-size:12px;color:#5B6B7A;line-height:1.5}
  .pp-sec{font-size:12.5px;font-weight:700;color:#fff;background:#1F3A6E;padding:4px 8px;margin:0 0 8px}
  .pp-inputs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px;margin-bottom:6px}
  .pp-inputs th{background:#EEF1F4;color:#1F3A6E;font-weight:600;text-align:left;font-size:11px;padding:4px}
  .pp-mini td.in{background:#FFF2A8;color:#8B0000;font-weight:600}
  .pp-headline{font-size:12.5px;line-height:1.45;margin:0 0 4px}
  .pp-sub{font-size:11px;color:#5B6B7A;margin:0 0 8px}
  .pp-kpi{width:100%;border-collapse:collapse;margin-bottom:8px}
  .pp-kpi th{background:#1F3A6E;color:#fff;font-weight:600;font-size:10.5px;padding:5px 6px;text-align:right}
  .pp-kpi th:first-child{text-align:left}
  .pp-kpi td{padding:5px 6px;border-bottom:1px solid #DAE0E6}
  .pp-kpi tr.au td{background:#FBF4DC}
  .pp-bridges{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:8px}
  .pp-bridges .wf{max-width:72%;margin:0 auto 2px;display:block}
  .pp-bridges .trend{max-width:90%}
  .pp-h{font-size:12.5px;font-weight:700;color:#1F3A6E;border-bottom:1px solid #1F3A6E;padding-bottom:3px;margin-bottom:6px}
  .pp-h span{font-weight:400;color:#5B6B7A;font-size:9.5px;margin-left:6px}
  .wf{max-width:100%}
  .pp-mini{width:100%;border-collapse:collapse;font-size:10.5px}
  .pp-mini td,.pp-mini th{padding:3px 5px;border-bottom:1px solid #EEF1F4}
  .pp-mini th{text-align:right;color:#5B6B7A;font-weight:500}
  .pp-mini th:first-child{text-align:left}
  .pp-mini tr.tot td{border-top:1px solid #1F3A6E;border-bottom:0;font-weight:600}
  .pp-note{font-size:9px;color:#5B6B7A;margin:3px 0 8px;line-height:1.35}
  .pp-comm{margin-top:8px;font-size:11px;line-height:1.4}
  .pp-comm b{color:#1F3A6E}
  .pp-comm p{margin:2px 0 0;white-space:pre-wrap}
  .pp-foot{display:flex;justify-content:space-between;font-size:11px;color:#5B6B7A;border-top:1px solid #DAE0E6;padding-top:6px;margin-top:auto}
  .neg{color:#8B0000}.pos{color:#00A650}
}
