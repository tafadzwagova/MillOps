@import url('https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap');
.wrap{font-family:'Instrument Sans',system-ui,sans-serif;background:#EEF1F4;color:#16212E;min-height:100vh;padding:18px;font-size:13.5px;font-variant-numeric:tabular-nums}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.brand{font-size:12px;color:#5B6B7A;font-weight:500}
h1{margin:2px 0 0;font-size:24px;font-weight:700;letter-spacing:-.01em}
h1 .yr{font-weight:400;color:#5B6B7A;font-size:16px}
.ctl{display:flex;gap:8px;flex-wrap:wrap}
select,button{font:inherit;border:1px solid #C3CBD3;background:#fff;border-radius:4px;padding:6px 10px;color:#16212E;cursor:pointer}
button.primary{background:#1B2A41;color:#fff;border-color:#1B2A41;min-width:70px}
button.danger{border-color:#8B0000;color:#8B0000}
.tabs{display:flex;gap:0;border-bottom:2px solid #C3CBD3;margin-bottom:14px}
.tabs button{border:0;background:none;border-radius:0;padding:8px 14px;color:#5B6B7A;font-weight:500;margin-bottom:-2px;border-bottom:2px solid transparent}
.tabs button.on{color:#16212E;border-bottom-color:#B8860B;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.span{grid-column:1/-1}
@media(max-width:720px){.grid2{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid #DAE0E6;border-radius:4px;padding:12px 14px}
.card h2{margin:0 0 8px;font-size:14px;font-weight:600}
.card h2.bridge{font-size:18px;font-weight:700;letter-spacing:-.01em}
.card h2.bridge small{display:block;margin:2px 0 0;font-size:12px}
.card h2 small{font-weight:400;color:#5B6B7A;margin-left:6px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;white-space:nowrap}
th{font-weight:500;color:#5B6B7A;text-align:right;padding:4px 6px;border-bottom:1px solid #DAE0E6;font-size:12px}
th:first-child{text-align:left}
td{padding:3px 6px;border-bottom:1px solid #F0F3F5}
td.n{text-align:right}
td.b{font-weight:600}
tr.tot td{border-top:1px solid #16212E;font-weight:600;background:#F7F9FB}
tr.au td{background:#FBF4DC}
.inp{font:inherit;text-align:right;background:#FFF2A8;color:#A61B1B;border:1px solid #E6D77A;border-radius:3px;padding:3px 5px;font-weight:500}
.inp:focus{outline:2px solid #B8860B;outline-offset:0}
.kv label{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid #F0F3F5;gap:8px}
.kv .row{display:flex;justify-content:space-between;padding:6px 0;color:#5B6B7A}
.kv .row b{color:#16212E}
.muted{color:#5B6B7A}.small{font-size:12px;margin:8px 0 0}
.neg{color:#8B0000}.pos{color:#00A650}
.headline p{margin:0 0 8px;font-size:15px;line-height:1.45;max-width:72ch}
.headline button{margin-top:4px}
.wf{width:100%;max-width:360px;display:block}
.wft{font-size:11px;font-weight:600;fill:#16212E}
.wfl{font-size:11px;fill:#5B6B7A}
.foot{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;color:#5B6B7A;font-size:12px}
.sw{display:inline-block;width:12px;height:12px;background:#FFF2A8;border:1px solid #E6D77A;vertical-align:-2px;margin-right:4px}

@media print{
  .noprint{display:none!important}
  .wrap{background:#fff;padding:0;font-size:12px}
  .card{border:1px solid #ccc;break-inside:avoid;page-break-inside:avoid}
  .grid2{gap:8px}
  h1{font-size:20px}
  @page{size:A4;margin:14mm}
}
